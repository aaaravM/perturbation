[project]
name = "pxh"
version = "0.1.0"
description = "Planet X Hunter backend: SPHEREx data access, alignment, co-adds, photometry and spectra"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "astropy>=8.0.2",
  "astropy-healpix>=1.1",
  "reproject>=0.21",
  "photutils>=3.1,<4",
  "numpy>=2.5",
  "scipy>=1.18",
  "httpx>=0.28",
  "tenacity>=9.0",
  "fastapi>=0.135",
  "uvicorn[standard]>=0.32",
  "pillow>=11.0",
  "pydantic>=2.9",
]

[dependency-groups]
# astroquery and pyvo are research tools (not imported by pxh): kept out of the deployed API bundle.
dev = [
  "pytest>=8.3",
  "astroquery>=0.4.11",
  "pyvo>=1.10",
  "pytest-timeout>=2.3",
  "ruff>=0.8",
  "matplotlib>=3.9",
  "imageio>=2.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pxh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: test calls live archives (IRSA, CDS mirrors); run with --network",
]
timeout = 600

[tool.ruff]
line-length = 110
target-version = "py313"
