[project]
name = "pxh-ml"
version = "0.1.0"
description = "Models for the Perturbation website: data preparation, training and evaluation (PyTorch). Inference ships in the backend as plain NumPy."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "pxh",
  "torch>=2.6",
  "scikit-learn>=1.6",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "pytest>=8.3",
]

[tool.uv]
package = false

[tool.uv.sources]
pxh = { path = "../backend", editable = true }
